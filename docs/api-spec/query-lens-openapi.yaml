openapi: 3.0.3
info:
  contact:
    email: querylens@forgesphere.example.com
    name: ForgeSphere Database Reliability
  description: "Database query performance intelligence platform for the ForgeSphere\
    \ \necosystem. Captures slow queries from all databases, analyzes execution \n\
    plans, detects anti-patterns (N+1, full scans, missing indexes), and \nprovides\
    \ ranked optimization recommendations with projected impact. \nTurns 3-hour debugging\
    \ sessions into 30-second decisions. Zero code \nchanges required — pure observability\
    \ on top of existing databases.\n"
  title: Query Lens
  version: 1.0.0
servers:
- description: Production Server
  url: https://querylens.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8123/v1
security:
- bearerAuth: []
tags:
- description: "Analyze, monitor, and optimize database queries."
  name: Queries
paths:
  /analyze:
    post:
      description: "Takes a SQL query (or a reference to one from the slow-query log)\
        \ \nand performs deep analysis:\n  - Parses the query and identifies tables,\
        \ joins, filters\n  - Runs EXPLAIN (or EXPLAIN ANALYZE in dry-run mode)\n\
        \  - Detects anti-patterns (N+1, missing WHERE, SELECT *, OR in WHERE)\n \
        \ - Suggests indexes with projected performance improvement\n  - Recommends\
        \ query rewrites when applicable\nZero production impact — analysis runs against\
        \ a shadow clone or \nread replica.\n"
      operationId: analyzeQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/analyzeQuery_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryAnalysis"
          description: Analysis accepted and queued.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Analysis, recommendation, or slow query ID not found."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Database connection, EXPLAIN engine, or analysis backend unavailable."
      summary: Analyze a SQL query for performance optimization
      tags:
      - Queries
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Queries
  /analyses/{analysisId}:
    get:
      description: "Returns the full analysis — parsed query plan, detected anti-patterns,\
        \ \nranked optimization recommendations with projected improvement, and \n\
        actual vs. projected performance. Includes ready-to-apply SQL for \nsuggested\
        \ indexes and rewrites.\n"
      operationId: getQueryAnalysis
      parameters:
      - example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: analysisId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - example: true
        explode: true
        in: query
        name: includeExplainPlan
        required: false
        schema:
          default: false
          description: Include full EXPLAIN tree (verbose output).
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryAnalysis"
          description: Detailed query analysis.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Analysis, recommendation, or slow query ID not found."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Database connection, EXPLAIN engine, or analysis backend unavailable."
      summary: Fetch the detailed analysis result for a query
      tags:
      - Queries
      x-accepts: application/json
      x-tags:
      - tag: Queries
  /slow-queries:
    get:
      description: "Aggregated view of every query exceeding a latency threshold,\
        \ ranked \nby total time consumed (latency × frequency). Shows which queries\
        \ \nhurt the most — even a 200ms query can be worse than a 5s query if \n\
        it runs a million times. Feeds the daily DBA dashboard.\n"
      operationId: listSlowQueries
      parameters:
      - example: payment-db-prod
        explode: true
        in: query
        name: databaseId
        required: false
        schema:
          type: string
        style: form
      - example: 100
        explode: true
        in: query
        name: minLatencyMs
        required: false
        schema:
          default: 100
          description: Only include queries slower than this.
          type: integer
        style: form
      - example: 10
        explode: true
        in: query
        name: minCallFrequency
        required: false
        schema:
          default: 1
          description: Only include queries called at least this often per minute.
          type: integer
        style: form
      - explode: true
        in: query
        name: environment
        required: false
        schema:
          default: PRODUCTION
          enum:
          - DEV
          - STAGING
          - PRODUCTION
          - ALL
          type: string
        style: form
      - example: TOTAL_TIME_CONSUMED
        explode: true
        in: query
        name: orderBy
        required: false
        schema:
          default: TOTAL_TIME_CONSUMED
          enum:
          - TOTAL_TIME_CONSUMED
          - AVG_LATENCY
          - P99_LATENCY
          - CALL_FREQUENCY
          - ROWS_EXAMINED
          type: string
        style: form
      - example: LAST_24_HOURS
        explode: true
        in: query
        name: window
        required: false
        schema:
          default: LAST_24_HOURS
          enum:
          - LAST_HOUR
          - LAST_6_HOURS
          - LAST_24_HOURS
          - LAST_7_DAYS
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listSlowQueries_200_response"
          description: Paginated list of slow queries.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid payload or missing required fields.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Database connection, EXPLAIN engine, or analysis backend unavailable."
      summary: List all slow queries across the platform
      tags:
      - Queries
      x-accepts: application/json
      x-tags:
      - tag: Queries
  /recommendations/{recommendationId}/apply:
    post:
      description: "Executes the recommended optimization — creating an index, applying\
        \ a \nquery rewrite via a code patch (PR to Git), enabling a cache layer,\
        \ \nor adjusting a database parameter. Every action is auditable and \nreversible\
        \ within a grace window. Supports dry-run and canary modes.\n"
      operationId: applyRecommendation
      parameters:
      - example: b1a2c3d4-e5f6-7890-1234-567890abcdef
        explode: false
        in: path
        name: recommendationId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/applyRecommendation_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationAction"
          description: Optimization accepted and being applied.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Analysis, recommendation, or slow query ID not found."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A conflicting optimization is in progress or index already
            exists.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Database connection, EXPLAIN engine, or analysis backend unavailable."
      summary: Apply an optimization recommendation
      tags:
      - Queries
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Queries
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid payload or missing required fields.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Analysis, recommendation, or slow query ID not found."
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Database connection, EXPLAIN engine, or analysis backend unavailable."
  schemas:
    QueryAnalysis:
      example:
        completedAt: 2000-01-23T04:56:07.000+00:00
        performanceMetrics:
          currentP99Ms: 847
          currentP50Ms: 245
          rowsExamined: 12500000
          currentP95Ms: 620
          callsPerMinute: 450
          rowsReturned: 100
          ratioRowsExaminedToReturned: 125000.0
          totalTimeConsumedMinutes: 6352.5
        errorMessage: errorMessage
        normalizedQuery: SELECT * FROM orders WHERE customer_id = ? AND status = ?
          ORDER BY created_at DESC LIMIT 100
        antiPatterns:
        - severity: CRITICAL
          projectedImprovementMs: 835
          affectedColumns:
          - customer_id
          - status
          patternType: MISSING_INDEX
          detail: "No index on (customer_id, status) — full table scan on 12M rows."
        - severity: CRITICAL
          projectedImprovementMs: 835
          affectedColumns:
          - customer_id
          - status
          patternType: MISSING_INDEX
          detail: "No index on (customer_id, status) — full table scan on 12M rows."
        parsedStructure:
          joins: []
          tables:
          - orders
          usesSelectStar: true
          estimatedComplexity: SIMPLE
          limit: 100
          orderBy:
          - created_at DESC
          filters:
          - customer_id = ?
          - status = ?
        recommendations:
        - currentLatencyMs: 847
          notes: Use CONCURRENTLY to avoid table lock. Index size ~380MB.
          implementationEffort: EASY
          estimatedCostUSDPerMonth: 12.5
          description: This index eliminates the full table scan and speeds up the
            ORDER BY clause.
          sqlToApply: "CREATE INDEX CONCURRENTLY idx_orders_cust_status_created ON\
            \ orders (customer_id, status, created_at DESC);"
          implementationRisk: LOW
          recommendationId: b1a2c3d4-e5f6-7890-1234-567890abcdef
          recommendationType: ADD_INDEX
          title: "Add composite index on orders(customer_id, status, created_at)"
          projectedLatencyMs: 12
          projectedImprovementPercent: 98.6
        - currentLatencyMs: 847
          notes: Use CONCURRENTLY to avoid table lock. Index size ~380MB.
          implementationEffort: EASY
          estimatedCostUSDPerMonth: 12.5
          description: This index eliminates the full table scan and speeds up the
