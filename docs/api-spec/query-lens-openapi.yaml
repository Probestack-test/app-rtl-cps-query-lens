          recommendationType: ADD_INDEX
          title: "Add composite index on orders(customer_id, status, created_at)"
          projectedLatencyMs: 12
          projectedImprovementPercent: 98.6
        databaseType: POSTGRESQL
        explainPlan:
          planNode: Seq Scan
          table: orders
          cost: 125000.00..125000.00
          rows: 12500000
          filter: (customer_id = 12345 AND status = 'PENDING')
        aiSummary: This query scans 12.5M rows to return 100. Adding a composite index
          drops latency from 847ms to 12ms — a 70x speedup. Low risk; use CONCURRENTLY
          to avoid locks.
        analysisId: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        databaseId: payment-db-prod
        submittedAt: 2000-01-23T04:56:07.000+00:00
        queryFingerprint: fp-a1b2c3d4e5f6
        status: COMPLETED
      properties:
