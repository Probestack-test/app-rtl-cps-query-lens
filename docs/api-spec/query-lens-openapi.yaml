        normalizedQuery:
          description: Query with bind parameters replaced by placeholders (for grouping).
          example: SELECT * FROM orders WHERE customer_id = ? AND status = ? ORDER
            BY created_at DESC LIMIT 100
          type: string
        queryFingerprint:
          description: Stable hash identifying this query pattern.
          example: fp-a1b2c3d4e5f6
          type: string
        parsedStructure:
          $ref: "#/components/schemas/QueryAnalysis_parsedStructure"
        antiPatterns:
          items:
            $ref: "#/components/schemas/QueryAnalysis_antiPatterns_inner"
          type: array
        performanceMetrics:
          $ref: "#/components/schemas/QueryAnalysis_performanceMetrics"
        recommendations:
          items:
            $ref: "#/components/schemas/QueryAnalysis_recommendations_inner"
          type: array
        explainPlan:
          additionalProperties: true
          description: Full EXPLAIN tree if includeExplainPlan=true.
          example:
            planNode: Seq Scan
            table: orders
            cost: 125000.00..125000.00
            rows: 12500000
            filter: (customer_id = 12345 AND status = 'PENDING')
          type: object
        aiSummary:
          description: AI-generated plain-English summary.
          example: This query scans 12.5M rows to return 100. Adding a composite index
            drops latency from 847ms to 12ms — a 70x speedup. Low risk; use CONCURRENTLY
            to avoid locks.
          type: string
